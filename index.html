<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>QS Gauge</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <input id="pitcher" placeholder="Pitcher name" />
  <button onclick="go()">Predict</button>
  <canvas id="gauge" width="450" height="220"></canvas>

  <script>
    const ctx = document.getElementById('gauge').getContext('2d');
    const cfg = {
      type: 'doughnut',
      data: { datasets: [{ data: [0.01, 0.99] }] },
      options: {
        animation: { duration: 800 },
        rotation: -90,            // 起始角度
        circumference: 180,       // 半圓
        cutout: '70%',
        plugins: { legend: { display:false } }
      }
    };
    const chart = new Chart(ctx, cfg);

    async function go(){
      const name = document.getElementById('pitcher').value;
      const res = await fetch(`/predict?pitcher=${encodeURIComponent(name)}`);
      const js = await res.json();
      const p = Math.max(0.001, Math.min(0.999, js.qs_prob));
      chart.data.datasets[0].data = [p, 1-p];
      chart.update();
    }
  </script>
</body>
</html>
